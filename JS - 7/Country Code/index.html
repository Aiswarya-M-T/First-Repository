<html>
<head>
    <title>Country Code</title>
    <link rel="stylesheet" href="./assets/CSS/bootstrap.css">
    <script src="./assets/JS/index.js"></script>
</head>
<body>
    <div
        class="container p-5 w-50 my-5 text-center bg-info bg-gradient border border border-3 border-secondary rounded">
        <h2>Country Code</h2>
        <select id="country" class="m-3 w-50 rounded">
            <option value="">Select Country Code</option>
            <option value="IE">IE</option>
            <option value="IM">IM</option>
            <option value="IL">IL</option>
            <option value="IT">IT</option>
            <option value="JM">JM</option>
            <option value="JP">JP</option>
            <option value="JE">JE</option>
            <option value="JO">JO</option>
            <option value="KZ">KZ</option>
        </select>
        <div>
            <p id="result"></p>
        </div>
        <button type="button" class="btn btn-success btn-lg px-3 mx-2" onclick="countryCode()">Find</button>
    </div>
</body>
</html>
