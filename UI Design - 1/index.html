<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/style/style.css">
    <title>Health City Hospital</title>
</head>
<body>
    <div class="mainForm">
        <div class="form">
            <div class="headImg">
                <div class="header">
                    <img src="./assets/images/logo.jpg" alt="logo">
                </div>
                <div class="box">
                    <div class="healthCity">
                        <span class="title">HEALTH CITY</span>
                    </div>
                    <div class="hospital">
                        <span class="title">HOSPITAL</span>
                    </div>
                </div>
            </div>
            <div>
                <h2>Vaccination Consent Form</h2>
                <h3>Patient Information</h3>
            </div>
            <div class="nameField">
                <span>Full Legal Name*</span>
                <input type="text" name="full legal name" id="fullName">
            </div>
            <div class="flex-container">
                <div class="fieldSection">
                    <span>Date of Birth*</span>
                    <div class="dob">
                        <input type="text" name="dob" id="dob" placeholder="DD/MM/YYYY">
                        <img class="icon" src="./assets/images/calender.png" alt="icon">
                    </div>
                </div>
                <div class="fieldSection">
                    <span>Medical number (if known)</span>
                    <input type="text" name="medical number" id="medicalNumber">
                </div>
            </div>
            <div class="flex-container">
                <div class="fieldSection">
                    <span>Phone Number*</span>
                    <input type="text" name="phone number">
                </div>
                <div class="fieldSection">
                    <span>Email Address*</span>
                    <input type="email" name="mail" id="mail">
                </div>
            </div>
            <div class="nameField">
                <span>Address*</span>
            </div>
            <div class="flex-container">
                <div class="fieldSection">
                    <span class="font">Street*</span>
                    <input type="text" name="street">
                </div>
                <div class="fieldSection">
                    <span class="font">City/Suburb</span>
                    <input type="text" name="city">
                </div>
            </div>
            <div class="flex-container">
                <div class="fieldSection">
                    <span class="font">State*</span>
                    <input type="text" name="state">
                </div>
                <div class="fieldSection">
                    <span class="font">Zip/Post Code*</span>
                    <input type="text" name="postcode" id="post">
                </div>
            </div>
            <div class="nameField">
                <span>Country*</span>
                <input type="text" name="country" id="country">
            </div>
        </div>
    </div>
</body>
</html>
