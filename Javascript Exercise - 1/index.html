<!DOCTYPE html>
<html lang="en">
<head>
    <title>Largest & Smallest string</title>
    <link rel="stylesheet" href="./assets/CSS/bootstrap.css">
    <script src="./assets/JS/script.js"></script>
</head>
<body>
    <form class="container p-5 my-5 text-center bg-light bg-gradient border border-secondary rounded">
        <h2 class="fst-italic">Find Largest and Smallest String</h2>
        <div>
            <label for="user" class="text-white py-3">User Input</label>
            <div>
                <input type="text" id="userInput" name="userInput" class="p-2">
            </div>
        </div>
        <div class="text-danger">
            <p id="validate"></p>
        </div>
        <div>
            <p id="large" class="text-success"></p>
            <p id="small" class="text-success"></p>
        </div>
        <div class="p-3">
            <button type="button" class="btn btn-primary btn-lg px-3 mx-2" name="submitButton"
                onclick="findLargeSmallStr()">Submit</button>
            <button class="btn btn-secondary btn-lg px-3 mx-2" name="resetButton" onclick="clearForm()">Reset</button>
        </div>
    </form>
</body>
</html>
