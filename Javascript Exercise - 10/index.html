<html>
<head>
    <title>Validation</title>
    <link rel="stylesheet" href="./assets/CSS/bootstrap.css">
    <link rel="stylesheet" href="./assets/CSS/style.css">
    <script src="./assets/JS/script.js"></script>
</head>
<body>
    <form
        class="w-50 my-5 mt-5 border text-center border border-3 border-secondary bg-light shadow-lg p-3 mb-3 bg-body rounded">
        <h2 class="p-2 fst-italic">Form Validation</h2>
        <div>
            <label class="x-3">First Name <span class="text-danger">*</span></label>
            <input type="text" name="firstName" id="firstName" class=" width mb-2 bg-body rounded">
        </div>
        <div class="text-danger">
            <p class="validate"></p>
        </div>
        <div>
            <label>Last Name <span class="text-danger">*</span> </label>
            <input type="text" name="lastName" id="lastName" class="width mb-2 bg-body rounded">
        </div>
        <div class="text-danger">
            <p class="validate"></p>
        </div>
        <div>
            <label>Email <span class="text-danger">*</span></label>
            <input type="text" name="email" id="email" class="input-width mb-2 bg-body rounded">
        </div>
        <div class="text-danger">
            <p class="validate"></p>
        </div>
        <div>
            <label>Phone <span class="text-danger">*</span> </label>
            <input type="text" name="phone" id="phone" class="input-width mb-2 bg-body rounded">
        </div>
        <div class="text-danger">
            <p class="validate"></p>
        </div>
        <div>
            <label>Zipcode</label>
            <input type="text" name="zipcode" id="zipcode" class="input-width mb-2 bg-body rounded">
        </div>
        <div class="text-danger">
            <p class="validate"></p>
        </div>
        <div>
            <label>Address</label>
            <input type="text" name="address" id="address" class="input-width mb-2 bg-body rounded">
        </div>
        <div class="text-success">
            <p id="result"></p>
        </div>
        <div class="p-3 my-2">
            <button type="button" class="btn btn-success btn-lg px-3 mx-5 mb-2" onclick="validateForm()">Submit</button>
            <button id="reset" class="btn btn-secondary btn-lg px-3 mx-5  mb-2" onclick="clearForm()">Reset</button>
        </div>
    </form>
</body>
</html>
