<html>
    <head>
        <link rel="stylesheet" href="./assets/CSS/bootstrap.css">
        <script src="./assets/JS/script.js"></script>
        <title>Check String</title>
    </head>
    <body>
        <form class="container my-5 text-center bg-info bg-gradient border border-secondary rounded border-3 w-50">
            <h2 class="p-2 my-2 text-muted">Check string character  is same or not ?</h2>
            <div>
                <label for="user" class="p-3 fst-italic">User Input</label>
            </div>
            <div>
                <input type="text" id="userInput" class="p-2 w-50 shadow p-3 mb-2 bg-body rounded" name="userInput">
            </div>
            <div class="text-danger">
                <p id="validate"></p>
            </div>
            <div class="text-success">
                <p id="result"></p>
            </div>
            <div class="p-3 my-2">
                <button type="button" class="btn btn-success btn-lg px-3 mx-5 shadow mb-2" onclick="checkChar()">Check</button>
                <button class="btn btn-light btn-lg px-3 mx-5 shadow mb-2" onclick="clearForm()">Reset</button>
            </div>
        </form>
    </body>
</html>
